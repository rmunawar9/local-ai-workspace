[project]
name = "local-ai-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=6.3.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "markitdown[docx]>=0.1.8",
    "pdf2image>=1.17.0",
    "pypdf>=6.21.1",
    "pytesseract>=0.3.13",
    "streamlit>=1.66.0",
    "watchdog>=6.0.0",
]

[project.scripts]
local-ai-workspace = "local_ai_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
